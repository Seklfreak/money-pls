name: MoneyPls
options:
  bundleIdPrefix: dev.winktech
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  MoneyPls:
    type: application
    platform: iOS
    sources:
      - MoneyPls/Sources
      - MoneyPls/Assets.xcassets
      - path: MoneyPls/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: MoneyPls/Info.plist
      properties:
        CFBundleDisplayName: Money pls
        UILaunchScreen: {}
        UIDeviceFamily: [1]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Money pls scans receipts with the camera. Nothing leaves your phone.
        UIAppFonts:
          - Fonts/Fredoka-Medium.ttf
          - Fonts/Fredoka-SemiBold.ttf
          - Fonts/Fredoka-Bold.ttf
          - Fonts/Nunito-SemiBold.ttf
          - Fonts/Nunito-Bold.ttf
          - Fonts/Nunito-ExtraBold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moneypls
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: false
