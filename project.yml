name: MoneyPls
options:
  bundleIdPrefix: dev.winktech
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.27.0
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  MoneyPls:
    type: application
    platform: iOS
    sources:
      - MoneyPls/Sources
      - MoneyPls/Assets.xcassets
      - MoneyPls/PrivacyInfo.xcprivacy
      - path: MoneyPls/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: MoneyPls/Info.plist
      properties:
        CFBundleDisplayName: Money pls
        # Wired to the build settings — never put literal versions here.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SENTRY_DSN: $(SENTRY_DSN)
        UMAMI_URL: $(UMAMI_URL)
        UMAMI_WEBSITE_ID: $(UMAMI_WEBSITE_ID)
        UILaunchScreen: {}
        UIDeviceFamily: [1]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Money pls scans receipts with the camera. Nothing leaves your phone.
        UIAppFonts:
          - Fonts/Fredoka-Medium.ttf
          - Fonts/Fredoka-SemiBold.ttf
          - Fonts/Fredoka-Bold.ttf
          - Fonts/Nunito-SemiBold.ttf
          - Fonts/Nunito-Bold.ttf
          - Fonts/Nunito-ExtraBold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moneypls
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: false
      configs:
        # Manual signing for Release/archives, scoped to the app target only —
        # passing these on the xcodebuild command line applies them to SPM
        # package targets too, which refuse provisioning profiles. Debug (what
        # Xcode runs locally) stays on automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Money pls App Store
  MoneyPlsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MoneyPls/Tests
    dependencies:
      - target: MoneyPls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.moneypls.tests
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: true
        # Hosted by the app so `@testable import MoneyPls` sees the real thing.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MoneyPls.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MoneyPls
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  # Shared so `xcodebuild -scheme MoneyPls test` works from a clean checkout.
  MoneyPls:
    build:
      targets:
        MoneyPls: all
        MoneyPlsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoneyPlsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
